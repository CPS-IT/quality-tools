quality-tools:
  project:
    name: "global-path-overrides-test"
    php_version: "8.3"
    typo3_version: "13.4"
  paths:
    scan:
      - "src/"
      - "lib/"
  tools:
    rector:
      enabled: true
    phpstan:
      enabled: true
    php-cs-fixer:
      enabled: true
    fractor:
      enabled: true
    typoscript-lint:
      enabled: true
