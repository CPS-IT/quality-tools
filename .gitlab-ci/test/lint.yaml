.test:lint:
  variables:
    PHP_VERSION: "8.3"
  needs:
    - build:test
  stage: test

test:lint:composer:
  extends: .test:lint
  script:
    - composer lint:composer

test:lint:editorconfig:
  extends: .test:lint
  script:
    - composer lint:editorconfig

test:lint:php:
  extends: .test:lint
  script:
    - composer lint:php

test:lint:rector:
  extends: .test:lint
  script:
    - composer lint:rector

test:sca:php:
  extends: .test:lint
  script:
    - composer sca:php
